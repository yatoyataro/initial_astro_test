version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only, so a TypeScript 7 bump fails `npm ci`.
      # Remove this rule once @astrojs/check lists TypeScript 7 as supported.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
